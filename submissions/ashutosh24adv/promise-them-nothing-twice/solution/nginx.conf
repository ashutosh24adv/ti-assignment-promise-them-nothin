events {
    worker_connections 1024;
}

http {
    upstream relayapi_cluster {
        # Round-robin load balancing across all 3 application nodes
        server node1:3000 max_fails=3 fail_timeout=10s;
        server node2:3000 max_fails=3 fail_timeout=10s;
        server node3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://relayapi_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure customer identification headers pass cleanly
            proxy_pass_request_headers on;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
